name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runners have no display: never let matplotlib try to open a window.
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libportaudio2

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # On Linux a plain `pip install torch` pulls the CUDA build (gigabytes of
      # NVIDIA libraries). The CPU wheels are all the tests need.
      - name: CPU-only torch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install "torch>=2.8,<3" "torchaudio>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install mireasy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Cache Essentia models
        uses: actions/cache@v4
        with:
          path: mireasy/models
          key: essentia-models-${{ hashFiles('download_models.py') }}

      - name: Download Essentia models
        # Model-based tests skip themselves when the files are absent, so a
        # flaky model server must not fail the whole matrix.
        continue-on-error: true
        run: python download_models.py

      - name: Run tests
        run: python run_tests.py --cov=mireasy --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  slow:
    name: slow tier (real models) · ubuntu · Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libportaudio2

      - name: CPU-only torch
        run: python -m pip install "torch>=2.8,<3" "torchaudio>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install mireasy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Cache model checkpoints (BEAT THIS!, Demucs, Essentia)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            mireasy/models
          key: model-checkpoints-${{ hashFiles('download_models.py', 'pyproject.toml') }}

      - name: Warm model caches
        # The Demucs tests only run when the htdemucs checkpoint is already
        # cached; BEAT THIS! fetches its checkpoint on first use.
        run: |
          python download_models.py
          python -c "from demucs.pretrained import get_model; get_model('htdemucs')"
          python -c "from beat_this.inference import Audio2Beats; Audio2Beats(checkpoint_path='final0', device='cpu', dbn=False)"

      - name: Run full suite including the slow tier
        env:
          MIREASY_RUN_SLOW: "1"
        run: python run_tests.py
