name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests: a newer push cancels the older run. Pushes to main: never,
# the sequential macOS cells take ~15 min, and a second push inside that
# window used to cancel the first run's Macs before they reached a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI runners have no display: never let matplotlib try to open a window.
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  # Keep the Essentia models inside the checkout so the cache steps below
  # (path: mireasy/models) keep hitting; users get a per-user cache folder.
  MIREASY_MODELS_DIR: ${{ github.workspace }}/mireasy/models

jobs:
  test-linux:
    name: ubuntu · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libportaudio2

      # A plain `pip install torch` on Linux pulls the CUDA build (gigabytes of
      # NVIDIA libraries). The CPU wheels are all the tests need.
      - name: CPU-only torch
        run: python -m pip install "torch>=2.8,<3" "torchaudio>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install mireasy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Cache Essentia models
        uses: actions/cache@v4
        with:
          path: mireasy/models
          key: essentia-models-${{ hashFiles('download_models.py') }}

      - name: Download Essentia models
        # Model-based tests skip themselves when the files are absent, so a
        # flaky model server must not fail the whole matrix.
        continue-on-error: true
        run: python download_models.py

      - name: Run tests
        run: python run_tests.py --cov=mireasy --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: fast
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # GitHub's Apple-Silicon runner pool is capacity-constrained: requesting four
  # macOS jobs at once got three of them dropped unstarted ("not acquired by
  # Runner … after multiple attempts") on consecutive runs. One request at a
  # time is served; the four versions therefore run sequentially (~3 min each).
  # `macos-latest` floats (macOS 26 arm64 since Nov 2026, like mirdata/librosa
  # use). When GitHub's Mac pool is short, jobs can be dropped unstarted,
  # that is a capacity issue, not a test failure: "Re-run failed jobs".
  test-macos:
    name: macOS · Python ${{ matrix.python }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries
        run: brew install ffmpeg

      - name: Install mireasy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Cache Essentia models
        uses: actions/cache@v4
        with:
          path: mireasy/models
          key: essentia-models-${{ hashFiles('download_models.py') }}

      - name: Download Essentia models
        continue-on-error: true
        run: python download_models.py

      - name: Run tests
        run: python run_tests.py

  docs:
    name: docs · Sphinx build (Read the Docs setup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Only the docs toolchain: the runtime dependencies are mocked in
      # docs/conf.py, which is exactly how Read the Docs builds the site.
      - name: Install docs toolchain
        run: python -m pip install -r docs/requirements.txt

      - name: Build with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  slow:
    name: slow tier (real models) · ubuntu · Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libportaudio2

      - name: CPU-only torch
        run: python -m pip install "torch>=2.8,<3" "torchaudio>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install mireasy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Cache model checkpoints (BEAT THIS!, Demucs, Essentia)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            mireasy/models
          key: model-checkpoints-${{ hashFiles('download_models.py', 'pyproject.toml') }}

      - name: Warm model caches
        # The Demucs tests only run when the htdemucs checkpoint is already
        # cached; BEAT THIS! fetches its checkpoint on first use.
        run: |
          python download_models.py
          python -c "from demucs.pretrained import get_model; get_model('htdemucs')"
          python -c "from beat_this.inference import Audio2Beats; Audio2Beats(checkpoint_path='final0', device='cpu', dbn=False)"

      - name: Run full suite including the slow tier
        env:
          MIREASY_RUN_SLOW: "1"
        run: python run_tests.py --cov=mireasy --cov-report=xml

      # Codecov merges this with the fast-tier upload for the same commit, so
      # the badge also counts the real BEAT THIS! / Demucs code paths.
      - name: Upload coverage to Codecov (slow tier)
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: slow
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
