[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mireasy"
dynamic = ["version"]
description = "Accessible, reproducible music information retrieval (MIR) for researchers outside MIR: tempo, beats, syncopation, loudness, key, pitch, genre and mood per stimulus, exported as CSV."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Mehmet Atilay Kucukoglu" }]
# Essentia has no wheel for Python 3.15 yet, so pip must refuse it with a clear
# message. Raise this bound together with the classifiers and the CI matrix.
requires-python = ">=3.11,<3.15"
keywords = [
  "music information retrieval", "music psychology", "music therapy",
  "audio features", "tempo", "beat tracking", "syncopation", "loudness",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
]

# Compatible ranges live here; the exact, tested pins live in environment.yml.
# tests/test_packaging.py keeps the two files listing the same packages.
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "torch>=2.8,<3",
  "torchaudio>=2.8,<3",
  "librosa>=0.11,<1",
  "soundfile>=0.12",
  "sounddevice>=0.5",
  "pyloudnorm>=0.1",
  "mir_eval>=0.7",
  "demucs>=4.0,<5",
  "matplotlib>=3.9,<4",
  "ipython>=8",
  # Essentia: AGPL-3.0 code, CC BY-NC-SA 4.0 models (see DEPENDENCY_LICENSES.md).
  # Python 3.14 wheels exist only from build dev1438 onward.
  "essentia-tensorflow==2.1b6.dev1389; python_version < '3.14'",
  "essentia-tensorflow==2.1b6.dev1438; python_version >= '3.14'",
  # BEAT THIS! (MIT) beat tracker, from PyPI (pure-Python wheel). PyPI rejects
  # packages with direct-URL dependencies, so this line is what makes a
  # `pip install mireasy` release possible (issue #21).
  "beat-this>=1.1,<2",
  # Root certificates for the model downloads (mireasy/certs.py).
  "certifi>=2024.7.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
notebooks = ["ipykernel"]
# Same list as docs/requirements.txt (Read the Docs installs that file alone).
docs = ["sphinx>=7.3,<9", "pydata-sphinx-theme>=0.15,<1", "myst-parser>=3,<5",
        "sphinx-copybutton>=0.5,<1"]

[project.scripts]
mireasy = "mireasy.__main__:main"
mireasy-download-models = "mireasy.download_models:main"

[project.urls]
Homepage = "https://github.com/Atilik/mireasy"
Documentation = "https://mireasy.readthedocs.io"
Issues = "https://github.com/Atilik/mireasy/issues"

[tool.setuptools]
packages = ["mireasy"]

[tool.setuptools.dynamic]
version = { attr = "mireasy.__version__" }

[tool.setuptools.package-data]
# The five synthetic demo songs (480 KB, MP3) ship inside the wheel so
# `mireasy --demo` works after a plain `pip install mireasy`. Only the audio:
# a .py file here would get byte-compiled on install, and the resulting
# __pycache__ subfolder made the loader read the demo as a participant folder.
# The regeneration script stays in the repository for provenance.
mireasy = ["sample_stimuli/*.mp3"]

[tool.setuptools.exclude-package-data]
# The Essentia models (~45 MB, fetched by mireasy-download-models) never ship
# inside the package.
mireasy = ["models/*"]

[tool.coverage.run]
source = ["mireasy"]
# play.py and plot.py are the Tk GUI windows (interactive player, spectrogram
# viewer). They cannot run on a headless CI machine, so counting them would
# only hide how well the analysis code is tested. Measured by hand when the
# GUI changes.
omit = ["mireasy/play.py", "mireasy/plot.py"]
